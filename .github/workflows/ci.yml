name: native-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      FANIN_FAILURE_DIR: qa-local/failures
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make sanitize
      - run: setarch "$(uname -m)" -R make tsan
      - run: docker build --target runtime -t prento:test .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: process-test-failure-diagnostics
          path: ${{ env.FANIN_FAILURE_DIR }}
          if-no-files-found: ignore
